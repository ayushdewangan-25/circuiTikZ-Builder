<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CircuiTikZ Builder – draw a circuit, get LaTeX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>CircuiTikZ <span>Builder</span></h1>
    <div class="actions">
      <select id="template" aria-label="Load template">
        <option value="">Load template…</option>
        <option value="divider">Voltage divider</option>
        <option value="rc">RC low-pass filter</option>
        <option value="rlc">Series RLC circuit</option>
        <option value="dab">1Φ single stage AC-DC</option>
        <option value="dabgan">1Φ Single-Stage AC-DC using GaN</option>
        <option value="ctrlsps">Block diagram: SPS current control loop</option>
        <option value="foc">Block diagram: induction-motor FOC</option>
      </select>
      <button id="btn-undo" title="Undo (Ctrl+Z)">Undo</button>
      <button id="btn-redo" title="Redo (Ctrl+Y or Ctrl+Shift+Z)">Redo</button>
      <button id="btn-clear" class="danger">Clear</button>
      <button id="btn-help" title="Keyboard shortcuts (?)">Shortcuts <kbd>?</kbd></button>
    </div>
  </header>

  <dialog id="help-dialog" class="help-dialog" aria-labelledby="help-title">
    <div class="help-head">
      <h2 id="help-title">Keyboard shortcuts</h2>
      <button id="help-close" title="Close (Esc)" aria-label="Close">✕</button>
    </div>
    <div id="help-body" class="help-body"></div>
  </dialog>

  <main class="layout">
    <aside class="palette" id="palette" aria-label="Components"></aside>

    <section class="canvas-wrap">
      <div class="canvas-scroll" id="canvas-scroll">
        <svg id="canvas" width="2400" height="1600" viewBox="0 0 2400 1600" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
              <circle cx="0" cy="0" r="1.6" fill="#c3cad4"/>
              <circle cx="40" cy="0" r="1.6" fill="#c3cad4"/>
              <circle cx="0" cy="40" r="1.6" fill="#c3cad4"/>
              <circle cx="40" cy="40" r="1.6" fill="#c3cad4"/>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#grid)"/>
          <g id="layer-elements"></g>
          <g id="layer-overlay"></g>
        </svg>
      </div>
      <div class="statusbar">
        <span id="status-tool"></span>
        <span id="status-hint" class="muted"></span>
        <span id="status-pos" class="pos"></span>
        <label class="gridsel">Grid
          <select id="opt-grid">
            <option value="1">1 cm</option>
            <option value="0.5">0.5 cm</option>
            <option value="0.25">0.25 cm</option>
          </select>
        </label>
        <label class="gridsel" title="Show alignment guides and snap to nearby terminals">
          <input id="opt-align" type="checkbox" checked> Align
        </label>
        <span class="zoom" role="group" aria-label="Zoom">
          <button id="zoom-out" title="Zoom out (Ctrl+−)">−</button>
          <button id="zoom-level" title="Reset to 100% (Ctrl+0)">100%</button>
          <button id="zoom-in" title="Zoom in (Ctrl++)">+</button>
          <button id="zoom-fit" title="Fit circuit to view (Space)">Fit</button>
        </span>
      </div>
    </section>

    <aside class="side">
      <section class="card">
        <h2>Properties</h2>
        <div id="props-body"></div>
      </section>

      <section class="card">
        <h2>Output settings</h2>
        <div class="settings">
          <label>Symbol style
            <select id="opt-style">
              <option value="american">American</option>
              <option value="european">European</option>
            </select>
          </label>
          <label>Output
            <select id="opt-doc">
              <option value="full">Full standalone document</option>
              <option value="env">circuitikz environment only</option>
            </select>
          </label>
          <label>Scale
            <input id="opt-scale" type="number" min="0.2" max="5" step="0.1" value="1">
          </label>
          <label>Line width
            <span class="lw-wrap">
              <select id="opt-linewidth">
                <option value="0.4">0.4 pt (thin)</option>
                <option value="0.6">0.6 pt</option>
                <option value="0.8">0.8 pt</option>
                <option value="1">1.0 pt</option>
                <option value="1.2">1.2 pt (bold)</option>
                <option value="custom">Custom…</option>
              </select>
              <input id="opt-linewidth-custom" type="number" min="0.1" max="5" step="0.05" aria-label="Custom line width in pt" hidden>
            </span>
          </label>
          <label class="check"><input id="opt-autolabel" type="checkbox" checked> Auto-number labels</label>
        </div>
      </section>

      <section class="card code-card">
        <div class="card-head">
          <h2>LaTeX code</h2>
          <button id="btn-code-edit" title="Edit the code; the diagram follows your changes">Edit code</button>
        </div>
        <textarea id="code" readonly spellcheck="false" aria-label="Generated LaTeX code"></textarea>
        <p id="code-status" class="code-status" hidden></p>
        <div class="row" id="code-actions">
          <button id="btn-copy" class="primary">Copy code</button>
          <button id="btn-download">Download .tex</button>
        </div>
        <div class="row" id="code-edit-actions" hidden>
          <button id="btn-code-done" class="primary" title="Keep the changes (Ctrl+Enter)">Done</button>
          <button id="btn-code-cancel" title="Discard the changes (Esc)">Cancel</button>
        </div>
      </section>

      <section class="card">
        <h2>Download diagram</h2>
        <div class="row export-row">
          <button data-export="pdf">PDF</button>
          <button data-export="svg">SVG</button>
          <button data-export="png">PNG</button>
          <button data-export="jpg">JPG</button>
        </div>
        <div class="settings">
          <label>Image resolution
            <select id="opt-dpi">
              <option value="150">150 dpi</option>
              <option value="300" selected>300 dpi</option>
              <option value="600">600 dpi</option>
            </select>
          </label>
        </div>
        <p class="muted note">Exports the canvas drawing at true size (1 grid step = 1 cm). For the exact LaTeX typesetting, compile the .tex.</p>
      </section>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
